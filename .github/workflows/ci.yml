name: CYD firmware and native tests
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C++11 decoder/protocol regression suite
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude test/test_protocol.cpp -o /tmp/test_bluedriver
          /tmp/test_bluedriver
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build CYD firmware
        run: pio run -e cyd
      - name: Publish unverified firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: bluedriver-cyd-v0.1.0-experimental
          path: .pio/build/cyd/firmware.bin
          if-no-files-found: error
