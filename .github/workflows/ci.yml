name: CYD firmware and native tests
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C++11 decoder/protocol regression suite
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude test/test_protocol.cpp -o /tmp/test_bluedriver
          /tmp/test_bluedriver
      - name: BLE discovery filters and UUID classification
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude test/test_discovery.cpp -o /tmp/test_discovery
          /tmp/test_discovery
      - name: Offline LM sequence and error recovery tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude test/test_session.cpp -o /tmp/test_session
          /tmp/test_session
      - name: Deterministic offline session replay
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tools/replay_session.cpp -o /tmp/replay_session
          /tmp/replay_session | tee session-replay.log
      - name: Upload synthetic replay log
        uses: actions/upload-artifact@v4
        with:
          name: bluedriver-offline-session-replay
          path: session-replay.log
          if-no-files-found: error
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build CYD BLE firmware
        run: pio run -e cyd
      - name: Publish unverified firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: bluedriver-cyd-v0.3.0-ble-experimental
          path: .pio/build/cyd/firmware.bin
          if-no-files-found: error
